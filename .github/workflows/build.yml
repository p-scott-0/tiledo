name: Build TileDo

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyqt5 pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name TileDo tiledo.py

      # Every push to main → overwrite the rolling "latest" release.
      # The download link never changes, the exe is always current.
      # Title carries the version from tiledo.py — the in-app updater parses it.
      - name: Update latest release
        if: github.ref == 'refs/heads/main'
        run: |
          $v = (Select-String -Path tiledo.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          gh release delete latest --yes 2>$null
          git push --delete origin latest 2>$null
          gh release create latest dist/TileDo.exe `
            --title "TileDo v$v" `
            --notes "Most recent build (v$v). Download TileDo.exe and run directly - no install needed. The app can also update itself from Settings."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push a version tag (e.g. v1.2) → also create a named versioned release.
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TileDo.exe
          name: TileDo ${{ github.ref_name }}
          body: |
            ## TileDo ${{ github.ref_name }}
            Download **TileDo.exe** below — no installation required.
